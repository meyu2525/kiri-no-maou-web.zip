<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="主人公を自分で作って冒険し、霧の魔王を倒すブラウザRPG。">
<title>霧の魔王と小さな勇者</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: one narrow game column — status bar, high-res map screen (battle overlays it), message window, controls. Character creator replaces the play area. Single dark night-sky look by choice. */
:root{
  --night:#0b1029; --window:#131a3a; --window2:#1c2550; --edge:#e8e4d8; --fg:#f2efe6; --dim:#9aa3c7;
  --gold:#f2c14e; --hp:#e2605a; --mp:#5c9fe6; --ok:#6fcf8a;
  --pix:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic",monospace;
  color-scheme:dark;
}
html,body{height:100%}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--night);color:var(--fg);font-family:var(--pix);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px;}
.game{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
h1{margin:0;font-size:20px;font-weight:400;color:var(--gold);letter-spacing:.06em;text-wrap:balance}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.top small{color:var(--dim)}
.win{background:var(--window);border:3px double var(--edge);border-radius:6px;padding:10px 12px}
.stats{display:grid;grid-template-columns:auto repeat(4,minmax(0,1fr));gap:6px 12px;align-items:center;font-variant-numeric:tabular-nums}
.stats>div{display:flex;flex-direction:column;gap:3px;min-width:0}
.stats b{font-weight:400;color:var(--dim);font-size:12px;letter-spacing:.08em}
#face{width:44px;height:44px;border:2px solid var(--edge);border-radius:4px;background:var(--window2)}
.bar{height:6px;background:#2a3264;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;transition:width .3s}
.screen{position:relative;border:3px double var(--edge);border-radius:6px;overflow:hidden;background:#000;aspect-ratio:4/3;max-width:100%}
#map{display:block;width:100%;height:100%}
.battle{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 75%,#33265c,#07091c 78%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.battle::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(transparent,#05060f)}
#foe{width:52%;max-width:300px;aspect-ratio:1;position:relative;z-index:1}
#foe.hit{animation:shake .3s}
#herob{position:absolute;left:3%;bottom:2%;width:22%;max-width:130px;aspect-ratio:1;z-index:2}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.foename{font-size:17px;z-index:1}
.foehp{width:46%;z-index:1}
.pop{position:absolute;left:50%;top:38%;transform:translateX(-50%);font-size:28px;color:#fff;text-shadow:0 2px 0 #000,0 0 8px #000;z-index:3;pointer-events:none;animation:pop .8s forwards}
.pop.heal{color:var(--ok)}.pop.crit{color:var(--gold)}
@keyframes pop{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-40px)}}
.flash{animation:flash .25s}
@keyframes flash{50%{background:#7a1d1d}}
.log{min-height:5.6em;line-height:1.55;white-space:pre-line}
.controls{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.dpad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:4px}
.dpad button:nth-child(1){grid-area:1/2}.dpad button:nth-child(2){grid-area:2/1}.dpad button:nth-child(3){grid-area:2/3}.dpad button:nth-child(4){grid-area:3/2}
.cmds{display:grid;grid-template-columns:repeat(2,minmax(110px,1fr));gap:6px;flex:1;min-width:0;max-width:320px}
button{font:inherit;color:var(--fg);background:var(--window);border:2px solid var(--edge);border-radius:5px;padding:8px 10px;cursor:pointer;touch-action:manipulation}
button:hover:not(:disabled){background:var(--window2)}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
button .k{color:var(--dim);font-size:11px;margin-left:4px}
.help{color:var(--dim);font-size:12px;line-height:1.6}

/* creator */
.creator{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:16px}
.preview{display:flex;flex-direction:column;align-items:center;gap:8px}
#pv{width:100%;max-width:220px;aspect-ratio:1;background:radial-gradient(circle at 50% 60%,#2a3570,#10163a 70%);border:2px solid var(--edge);border-radius:6px}
.views{display:flex;gap:6px}
.views canvas{width:56px;height:56px;background:var(--window2);border:1px solid var(--dim);border-radius:4px}
.opts{display:flex;flex-direction:column;gap:12px;min-width:0}
.opt b{display:block;font-weight:400;color:var(--gold);font-size:13px;letter-spacing:.08em;margin-bottom:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:5px 10px;font-size:14px;border-width:1px}
.chips button[aria-pressed="true"]{background:var(--gold);color:#1a1a1a;border-color:var(--gold)}
.chips .img{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 6px 5px;min-width:72px;font-size:13px}
.chips .img canvas{width:60px;height:60px;background:radial-gradient(circle at 50% 60%,#2a3570,#10163a 75%);border-radius:4px}
.chips .img[aria-pressed="true"] canvas{background:radial-gradient(circle at 50% 60%,#fff4cf,#d9a83a 80%)}
#pv.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.04)}}
.chips .sw{width:30px;height:30px;padding:0;border-radius:50%;border:2px solid #0006}
.chips .sw[aria-pressed="true"]{outline:3px solid var(--gold);outline-offset:2px;background-color:inherit}
#name{font:inherit;font-size:17px;background:var(--window2);color:var(--fg);border:2px solid var(--edge);border-radius:5px;padding:6px 10px;width:100%;max-width:240px}
.classnote{color:var(--dim);font-size:12px;margin-top:4px;line-height:1.5}
.cact{display:flex;gap:8px;flex-wrap:wrap;grid-column:1/-1;justify-content:flex-end}
.cact .go{background:var(--gold);color:#1a1a1a;border-color:var(--gold)}
.chips .img.locked canvas{background:var(--window2)}
.chips .img .rs{font-size:10px;line-height:1;letter-spacing:-1px}
.chint{color:var(--dim);font-size:12px;margin-right:auto;align-self:center}
.sechead{display:flex;justify-content:space-between;gap:8px;border-top:1px dashed var(--dim);padding-top:12px;color:var(--fg);font-size:15px}
.sechead span:last-child{color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--window);border-top:3px double var(--edge);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding-block:6px}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;color:var(--dim);font-size:13px;border-radius:8px}
.nav button svg{width:26px;height:26px}
.nav button[aria-current="page"]{color:var(--gold);background:var(--window2)}
body.hasnav{padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}

/* gacha */
#gacha{display:flex;flex-direction:column;gap:10px}
.gtop{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:18px;align-items:center}
#gm{width:100%;max-width:240px;aspect-ratio:240/270;display:block;margin:0 auto}
.gside{display:flex;flex-direction:column;gap:10px;min-width:0}
.gstone{display:flex;gap:12px;align-items:center}
.gstone canvas{width:64px;height:64px;background:radial-gradient(circle at 50% 60%,#2a3570,#10163a 75%);border:2px solid var(--edge);border-radius:6px;flex:none}
.gstone b{display:block;font-weight:400;color:var(--dim);font-size:12px;letter-spacing:.08em}
#gstones{font-size:28px;color:#9fd8ff;font-variant-numeric:tabular-nums;line-height:1.1}
.gstone small{display:block;color:var(--dim);font-size:11px}
.gbtn{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:17px;padding:10px}
.gbtn small{font-size:11px;color:var(--dim)}
.gbtn.big{background:var(--gold);color:#1a1a1a;border-color:var(--gold)}
.gbtn.big:hover:not(:disabled){background:#f6d27a}
.gbtn.big small{color:#5a4410}
.gbtn.shopbtn{flex-direction:row;justify-content:center;gap:8px;font-size:15px;padding:8px;border-color:#9fd8ff;color:#9fd8ff}
.gbtn.shopbtn small{color:var(--dim)}
.shophead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.shophead b{font-weight:400;font-size:18px;color:#9fd8ff;letter-spacing:.06em}
.shophead button{padding:4px 10px;font-size:13px}
.shopnote{margin:8px 0 12px;color:var(--dim);font-size:12px;line-height:1.6}
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.pack{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 6px;border-color:#5a7fc4;background:linear-gradient(180deg,#1f2d63,var(--window))}
.pack canvas{width:56px;height:56px}
.pack .pn{font-size:13px}.pack .pst{font-size:16px;color:#9fd8ff;font-variant-numeric:tabular-nums}
.pack .pb{font-size:11px;color:var(--gold)}.pack .pb.none{visibility:hidden}
.pack .py{margin-top:4px;background:var(--gold);color:#1a1a1a;border-radius:4px;padding:2px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.confirm{margin-top:12px;border:2px solid var(--gold);border-radius:6px;padding:10px 12px;background:var(--window2)}
.confirm p{margin:0 0 10px;line-height:1.6}.confirm small{color:var(--dim)}
.cbtns{display:flex;gap:8px;justify-content:flex-end}.cbtns .yes{background:var(--gold);color:#1a1a1a;border-color:var(--gold)}
.spent{margin:10px 0 0;color:var(--dim);font-size:12px}
.gcount{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
.gmsg{margin:12px 0 0;line-height:1.6;min-height:1.6em;white-space:pre-line}
.gres{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:10px;perspective:600px}
.gres:empty{display:none}
.card{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border:2px solid var(--rc);min-width:0;
  background:linear-gradient(180deg,color-mix(in srgb,var(--rc) 24%,var(--window)),var(--window));animation:flipin .45s backwards}
.card canvas{width:100%;max-width:72px;aspect-ratio:1}
.card .rn{font-size:11px;letter-spacing:-.5px}
.card .nm{font-size:12px;text-align:center;line-height:1.3}
.card .bd{font-size:10px;color:var(--dim)}
.card .bd.new{background:var(--hp);color:#fff;padding:0 6px;border-radius:8px}
.card.r3{box-shadow:0 0 8px var(--rc)}.card.r4{box-shadow:0 0 16px var(--rc)}
@keyframes flipin{from{opacity:0;transform:rotateY(90deg) scale(.85)}to{opacity:1;transform:none}}
.gwin.ssr{animation:ssr 1.2s}
@keyframes ssr{25%{box-shadow:0 0 44px var(--gold);border-color:var(--gold)}}
.lineup summary{cursor:pointer;color:var(--gold)}
.lr{margin-top:10px}.lr b{font-weight:400;font-size:13px}
.lr div{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:3px;font-size:13px;color:var(--dim)}
.lr .own{color:var(--fg)}
@media (max-width:520px){.gtop{grid-template-columns:1fr}.gres{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){.card,.gwin.ssr{animation:none}}
@media (max-width:520px){.creator{grid-template-columns:1fr}.preview{flex-direction:row;justify-content:center;flex-wrap:wrap}#pv{max-width:170px}.views{flex-direction:column}}
@media (max-width:440px){.dpad{grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,42px)}.stats{grid-template-columns:auto repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){#pv.bump,#foe.hit,.flash,.pop{animation:none}.pop{opacity:0}}
</style>
</head>
<body>

<div class="game">
  <div class="top"><h1>霧の魔王と小さな勇者</h1><small id="where"></small></div>

  <section id="creator" class="win" hidden>
    <div class="creator">
      <div class="preview">
        <canvas id="pv" width="440" height="440"></canvas>
        <div class="views"><canvas id="pv1" width="112" height="112"></canvas><canvas id="pv2" width="112" height="112"></canvas><canvas id="pv3" width="112" height="112"></canvas></div>
      </div>
      <div class="opts" id="opts"></div>
      <div class="cact"><span class="chint" id="chint" hidden>えらぶと、すぐに着がえます。</span><button id="rand">ランダム</button><button id="cancel" hidden>もどる</button><button id="go" class="go">この姿で冒険へ</button></div>
    </div>
  </section>

  <section id="gacha" hidden>
    <div class="win gwin" id="gachaWin">
      <div class="gtop">
        <canvas id="gm" width="480" height="540" aria-label="ガチャマシン"></canvas>
        <div class="gside">
          <div class="gstone"><canvas id="gme" width="128" height="128" aria-label="いまの姿"></canvas><div><b>きらめき石</b><span id="gstones">0</span><small>戦闘・レベルアップ・魔王討伐で手に入る</small></div></div>
          <button id="g1" class="gbtn">1回まわす<small>石 10</small></button>
          <button id="g10" class="gbtn big">10連まわす<small>石 200・R以上が1つ確定</small></button>
          <button id="gshop" class="gbtn shopbtn">＋ 石を買う<small>ショップ</small></button>
          <div class="gcount" id="gcount"></div>
        </div>
      </div>
      <p class="gmsg" id="gmsg" aria-live="polite">石を使ってガチャを回すと、服やアクセサリー、武器、マントが手に入ります。</p>
      <div class="gres" id="gres"></div>
    </div>
    <div class="win shop" id="shop" hidden>
      <div class="shophead"><b>石ショップ</b><button id="shopclose">とじる</button></div>
      <p class="shopnote">お試し版のショップです。実際のお金は かかりません。ボタンを押すと、その場で石が追加されます。</p>
      <div class="packs" id="packs"></div>
      <div class="confirm" id="confirm" hidden></div>
      <p class="spent" id="spent"></p>
    </div>
    <details class="win lineup"><summary>ラインナップと出現率</summary><div id="glist"></div></details>
  </section>

  <div id="play" hidden>
    <div class="game">
      <div class="win stats" id="statsbox"><canvas id="face" width="88" height="88"></canvas><div id="s1"></div><div id="s2"></div><div id="s3"></div><div id="s4"></div></div>
      <div class="screen" id="screen">
        <canvas id="map" width="1280" height="960"></canvas>
        <div class="battle" id="battle" hidden>
          <canvas id="foe" width="480" height="480"></canvas>
          <div class="foename" id="foename"></div>
          <div class="bar foehp"><i id="foebar" style="background:var(--hp)"></i></div>
          <canvas id="herob" width="192" height="192"></canvas>
        </div>
      </div>
      <div class="win log" id="log" aria-live="polite"></div>
      <div class="controls">
        <div class="dpad" id="dpad">
          <button data-d="0,-1" aria-label="上">▲</button><button data-d="-1,0" aria-label="左">◀</button>
          <button data-d="1,0" aria-label="右">▶</button><button data-d="0,1" aria-label="下">▼</button>
        </div>
        <div class="cmds" id="cmds"></div>
      </div>
      <div class="help">移動：矢印キー / WASD　コマンド：数字キー（戦闘中の「にげる」はRキー）　草原を歩くと魔物が出ます。川の北は強敵の地。北東の城に霧の魔王がいます。</div>
    </div>
  </div>
</div>

<nav class="nav" id="nav" hidden aria-label="メニュー"><div class="in">
  <button data-view="gacha"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.5" r="6"/><path d="M6 14.5h12V21H6z"/><circle cx="12" cy="17.8" r="1.2"/></svg>ガチャ</button>
  <button data-view="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5h4v5"/></svg>ホーム</button>
  <button data-view="closet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M10 5.5a2 2 0 1 1 2 2v2l9 7.5H3l9-7.5"/></svg>衣装</button>
</div></nav>

<script>
/* ================= data ================= */
const MAP=[
"^^^^^^^^^^^^^^^^^^^^",
"^..T....^^^....T.C.^",
"^.TT.........TT....^",
"^......T.....,,,,..^",
"^..H....,,,,,,..T..^",
"~~~~~~~~=~~~~~~~~~~~",
"^..T....,.....T....^",
"^.......,..........^",
"^.TT....,,,,,...^^.^",
"^.T.........,...^..^",
"^......H....,......^",
"^...........,..TT..^",
"^..^^.......,......^",
"^.....T.....,......^",
"^^^^^^^^^^^^^^^^^^^^"];
const W=20,H=15,TS=32,BLOCK=new Set(['^','~','T']);
const tile=(x,y)=>(y<0||y>=H||x<0||x>=W)?'^':(MAP[y][x]||'^');
const hash=(x,y,i=0)=>{const s=Math.sin(x*12.9898+y*78.233+i*37.719)*43758.5453;return s-Math.floor(s)};

const LOOK_OPTS={
  hair:[["short","ショート"],["long","ロング"],["spiky","ツンツン"],["pony","ポニテ"],["bob","ボブ"],["hat","とんがり帽子"]],
  hairC:["#2b2420","#7a4a2a","#e0b04a","#d94b4b","#5b8fd9","#ece8f4","#7fbf6a","#b06ad9"],
  skin:["#fde3cc","#f2c9a0","#dca57a","#a8714a","#6e4a32"],
  cloth:["#3d6fd1","#c0392b","#2f9e6a","#7a4fc4","#e09a3a","#3a3f52","#e8e4d8","#e46aa4"],
  eye:["#2a2140","#3c6fd8","#2f9e6a","#c0392b","#b07a2a"],
  weapon:[["sword","剣"],["staff","杖"],["axe","斧"],["bow","弓"]],
  cape:[[true,"あり"],[false,"なし"]]
};
const CLASSES={
  fighter:{n:"剣士",note:"HPと攻撃力が高い。たたかうが得意。",hp:36,mp:8,atk:10,def:4,g:{hp:8,mp:2,atk:4,def:2},fire:1,heal:1,w:"sword"},
  mage:{n:"魔法使い",note:"MPが多く、ファイアの威力が1.5倍。打たれ弱い。",hp:26,mp:18,atk:6,def:2,g:{hp:5,mp:5,atk:2,def:1},fire:1.5,heal:1,w:"staff"},
  priest:{n:"僧侶",note:"守りが固く、ヒールの回復量が1.5倍。",hp:32,mp:13,atk:7,def:5,g:{hp:7,mp:4,atk:3,def:2},fire:1,heal:1.5,w:"staff"},
  hunter:{n:"狩人",note:"会心の一撃が出やすく、にげるのが得意。",hp:30,mp:10,atk:9,def:3,g:{hp:6,mp:3,atk:3,def:2},fire:1,heal:1,w:"bow",crit:.2,run:.85}
};
const DEFAULT_LOOK={name:"ユウ",cls:"fighter",hair:"spiky",hairC:"#7a4a2a",skin:"#f2c9a0",cloth:"#3d6fd1",eye:"#2a2140",weapon:"sword",cape:true,outfit:"tunic",acc:"none",capeC:"auto"};

/* gacha lineup: r = rarity 1:N 2:R 3:SR 4:SSR */
const ITEMS=[
 {id:"acc_ribbon",cat:"acc",val:"ribbon",n:"赤いリボン",r:1},
 {id:"acc_headband",cat:"acc",val:"headband",n:"はちまき",r:1},
 {id:"acc_flower",cat:"acc",val:"flower",n:"花かざり",r:1},
 {id:"capeC_red",cat:"capeC",val:"#b8322a",n:"赤いマント",r:1},
 {id:"capeC_green",cat:"capeC",val:"#2d7a4a",n:"森のマント",r:1},
 {id:"capeC_white",cat:"capeC",val:"#e8e4d8",n:"白いマント",r:1},
 {id:"acc_catears",cat:"acc",val:"catears",n:"ネコミミ",r:2},
 {id:"acc_goggles",cat:"acc",val:"goggles",n:"ぼうけんゴーグル",r:2},

  if(mode!=="battle"||busy)return;

}
function foeTurn(prev){
  let v,msg;
  if(foe.boss){bossTurn++;
    if(bossTurn%3===0){v=Math.round(dmg(foe.atk,P.def)*1.6);msg=`霧の魔王は くらやみの霧を はきだした！\n${v}のダメージ！`}
    else{v=dmg(foe.atk,P.def);msg=`霧の魔王の攻撃！ ${v}のダメージ！`}}
  else if(foe.spell&&Math.random()<.4){v=Math.round((8+foe.atk*.6)*rnd(.9,1.1));msg=`${foe.n}は 雷の呪文をとなえた！ ${v}のダメージ！`}
  else{v=dmg(foe.atk,P.def);if(Math.random()<.07){v=0;msg=`${foe.n}の攻撃！ しかし ${P.look.name}は ひらりとかわした。`}else msg=`${foe.n}の攻撃！ ${v}のダメージ！`}

    log(msg+`\n霧の魔王を たおした！ 霧が晴れ、世界に光がもどった。\nおめでとう、${P.look.name}！ きらめき石×100を手に入れた。\n（そのまま旅を続けられます）`);return}
  P.exp+=foe.exp;P.gold+=foe.g;
  let t=`${msg}\n${foe.n}を たおした！ ${foe.exp}EXPと ${foe.g}Gを手に入れた。`;

  const st=(P.y<5?5:2)+Math.floor(Math.random()*2);P.stones+=st;t+=` きらめき石×${st}。`;

  endBattle();log(t);save();
}

  const inp=document.createElement("input");inp.id="name";inp.maxLength=6;inp.value=draft.name;inp.autocomplete="off";
  inp.oninput=()=>{draft.name=inp.value;applyCloset()};n.appendChild(inp);o.appendChild(n);
  if(creatingNew){const c=CLASSES[draft.cls];o.appendChild(group("しょくぎょう","cls",Object.entries(CLASSES).map(([k,v])=>({val:k,label:v.n})),`${c.note}　HP${c.hp} MP${c.mp} 攻${c.atk} 守${c.def}`))}
  o.appendChild(group("かみがた","hair",ent(LOOK_OPTS.hair)));
  o.appendChild(group("かみのいろ","hairC",cols(LOOK_OPTS.hairC,"かみのいろ")));
  o.appendChild(group("ひとみ","eye",cols(LOOK_OPTS.eye,"ひとみ")));
  o.appendChild(group("はだ","skin",cols(LOOK_OPTS.skin,"はだ")));
  o.appendChild(group("ふくのいろ","cloth",cols(LOOK_OPTS.cloth,"ふくのいろ")));
  if(creatingNew){
    o.appendChild(group("ぶき","weapon",ent(LOOK_OPTS.weapon)));
    o.appendChild(group("マント","cape",ent(LOOK_OPTS.cape)));
  }else{
    const cnt=ITEMS.filter(i=>owns(i.id)).length;
    const h=document.createElement("div");h.className="sechead";h.innerHTML=`<span>ガチャ衣装</span><span>${cnt} / ${ITEMS.length} 入手</span>`;o.appendChild(h);
    o.appendChild(group("ふく","outfit",gachaEnt("outfit")));
    o.appendChild(group("アクセサリー","acc",gachaEnt("acc"),draft.hair==="hat"?"とんがり帽子のときは、天使の輪と魔王のツノ以外は帽子にかくれます。":""));
    o.appendChild(group("ぶき","weapon",gachaEnt("weapon")));
    o.appendChild(group("マント","cape",ent(LOOK_OPTS.cape)));
    o.appendChild(group("マントのいろ","capeC",gachaEnt("capeC")));
  }
  if(keepFocus)$("name").focus();
  else if(lastPick){const b=o.querySelector(`button[data-k="${lastPick[0]}"][data-v="${CSS.escape(lastPick[1])}"]`);if(b)b.focus({preventScroll:true});lastPick=null}
}
function openCreator(isNew){
  creatingNew=isNew;draft={...(P?P.look:DEFAULT_LOOK)};
  $("cancel").hidden=!(isNew&&P);$("go").hidden=!isNew;$("chint").hidden=isNew;
  buildOpts();drawPreview();show(isNew?"create":"closet");
}
const pick=a=>a[Math.floor(Math.random()*a.length)];
$("rand").onclick=()=>{const v=x=>Array.isArray(x)?x[0]:x;
  const avail=cat=>gachaEnt(cat).filter(e=>!e.item||owns(e.item.id)).map(e=>e.val);
  Object.assign(draft,{hair:v(pick(LOOK_OPTS.hair)),hairC:pick(LOOK_OPTS.hairC),eye:pick(LOOK_OPTS.eye),skin:pick(LOOK_OPTS.skin),cloth:pick(LOOK_OPTS.cloth),cape:Math.random()<.6});
  if(creatingNew){draft.cls=pick(Object.keys(CLASSES));draft.weapon=v(pick(LOOK_OPTS.weapon))}
  else{draft.weapon=pick(avail("weapon"));draft.outfit=pick(avail("outfit"));draft.acc=pick(avail("acc"));draft.capeC=pick(avail("capeC"));if(draft.capeC!=="auto")draft.cape=true}
  applyCloset();buildOpts();drawPreview();bump()};
$("cancel").onclick=()=>show("home");
$("go").onclick=()=>{
  draft.name=(draft.name||"").trim()||"ユウ";
  const keep=P?{stones:P.stones,owned:P.owned}:null;
  P=newPlayer(draft);if(keep)Object.assign(P,keep);
  rx=P.x;ry=P.y;dir="down";mode="map";save();show("home");
  log(`北の城に霧の魔王があらわれ、世界は霧につつまれた。\n${C().n}の${P.look.name}よ、まずは南の草原で腕をみがこう。\n（下のボタンから、ガチャと衣装にも行けます）`);
};

/* ================= gacha ================= */
const gm=$("gm").getContext("2d");gm.setTransform(2,0,0,2,0,0);
const CAPS=[];{const cl=["#e2605a","#f2c14e","#6fcf8a","#5c9fe6","#b48cff","#ff9ec4","#7fd1e8"];let n=0,guard=0;
  while(n<24&&guard<2000){guard++;const x=62+Math.random()*116,y=58+Math.random()*76;if((x-120)**2+(y-74)**2>54*54)continue;if(CAPS.some(c=>(c.x-x)**2+(c.y-y)**2<16*16))continue;CAPS.push({x,y,c:cl[n%cl.length],a:Math.random()*6});n++}
  CAPS.sort((a,b)=>a.y-b.y)}
function drawCapsule(c,x,y,r,col,a){c.save();c.translate(x,y);c.rotate(a);c.lineWidth=1.5;c.strokeStyle="rgba(30,20,40,.8)";
  c.beginPath();c.arc(0,0,r,Math.PI,0);c.closePath();c.fillStyle=col;c.fill();
  c.beginPath();c.arc(0,0,r,0,Math.PI);c.closePath();c.fillStyle="#f6f4ee";c.fill();
  c.beginPath();c.arc(0,0,r,0,Math.PI*2);c.stroke();c.beginPath();c.moveTo(-r,0);c.lineTo(r,0);c.stroke();
  ell(c,-r*.35,-r*.45,r*.28,r*.16,"rgba(255,255,255,.6)");c.restore()}
function drawMachine(s={}){
  const c=gm;c.clearRect(0,0,240,270);
  ell(c,120,256,92,8,"rgba(0,0,0,.45)");
  c.lineWidth=3;c.strokeStyle="#3a0e10";
  const bgd=c.createLinearGradient(0,140,0,250);bgd.addColorStop(0,"#e0524a");bgd.addColorStop(1,"#9c2622");
  c.fillStyle=bgd;rr(c,36,138,168,112,18);c.fill();c.stroke();
  c.fillStyle="rgba(255,255,255,.18)";rr(c,46,144,148,8,4);c.fill();
  c.fillStyle="#f2e8d0";rr(c,58,156,124,24,6);c.fill();c.stroke();
  c.fillStyle="#7a2020";c.font='14px "DotGothic16", monospace';c.textAlign="center";c.textBaseline="middle";c.fillText("きらめきガチャ",120,168.5);
  c.save();c.translate(84,214);c.fillStyle="#cfd4e0";c.beginPath();c.arc(0,0,17,0,7);c.fill();c.stroke();c.rotate(s.rot||0);c.fillStyle="#f2c14e";rr(c,-15,-4,30,8,4);c.fill();c.stroke();ell(c,0,0,4,4,"#3a0e10");c.restore();
  c.fillStyle="#2a0f12";rr(c,132,194,52,40,10);c.fill();c.stroke();
  if(s.cap){c.save();c.beginPath();c.rect(132,194,52,40);c.clip();if(s.cap.glow){c.shadowColor=s.cap.col;c.shadowBlur=22}drawCapsule(c,158,s.cap.y,13,s.cap.col,0);c.restore()}
  c.fillStyle="#f2c14e";rr(c,86,126,68,16,5);c.fill();c.stroke();
  c.save();c.beginPath();c.arc(120,74,64,0,7);c.fillStyle="rgba(170,210,255,.14)";c.fill();c.clip();
  const j=s.jit||0,t=performance.now()/45;
  for(const k of CAPS)drawCapsule(c,k.x+Math.sin(t+k.a)*j,k.y+Math.cos(t*1.3+k.a)*j,9,k.c,k.a+(j?t*.15:0));
  c.restore();
  c.beginPath();c.arc(120,74,64,0,7);c.lineWidth=3;c.strokeStyle="#e8e4d8";c.stroke();
  c.strokeStyle="rgba(255,255,255,.5)";c.lineWidth=5;c.lineCap="round";c.beginPath();c.arc(120,74,52,Math.PI*1.12,Math.PI*1.42);c.stroke();c.lineCap="butt";
  c.fillStyle="#f2c14e";rr(c,106,4,28,12,4);c.fill();c.lineWidth=3;c.strokeStyle="#3a0e10";c.stroke();
}
const gme=$("gme").getContext("2d");
function drawGachaHero(){gme.clearRect(0,0,128,128);drawHero(gme,6.4,6,3.6,P.look,"down")}
function renderGacha(){
  $("gstones").textContent=P.stones;
  $("g1").disabled=gBusy||P.stones<COST1;$("g10").disabled=gBusy||P.stones<COST10;
  const cnt=ITEMS.filter(i=>owns(i.id)).length;$("gcount").textContent=`コレクション ${cnt} / ${ITEMS.length}`;
  $("glist").innerHTML=[4,3,2,1].map(r=>`<div class="lr"><b style="color:${RCOL[r]}">${RNAME[r]} ${starStr(r)}　${Math.round(RATES[r]*100)}%</b><div>${ITEMS.filter(i=>i.r===r).map(i=>`<span class="${owns(i.id)?"own":""}">${i.n}${owns(i.id)?" ✓":""}</span>`).join("")}</div></div>`).join("");
  if(!gBusy)drawMachine();drawGachaHero();
}
let gBusy=false;
function rollOne(minR=1){const x=Math.random();let r=x<.03?4:x<.15?3:x<.45?2:1;if(r<minR)r=minR;const pool=ITEMS.filter(i=>i.r===r);return pool[Math.floor(Math.random()*pool.length)]}
function pull(n){
  const cost=n===1?COST1:COST10;if(gBusy||P.stones<cost||mode!=="map")return;
  P.stones-=cost;
  const res=[];for(let i=0;i<n;i++)res.push(rollOne());
  if(n===10&&!res.some(i=>i.r>=2))res[9]=rollOne(2);
  const out=res.map(it=>{const isNew=!P.owned.includes(it.id);if(isNew)P.owned.push(it.id);else P.stones+=DUPE[it.r];return{it,isNew}});
  save();gBusy=true;renderGacha();$("gres").innerHTML="";$("gmsg").textContent="ガチャを回しています……";
  const best=Math.max(...res.map(i=>i.r));
  const finish=()=>{gBusy=false;drawMachine();showResults(out,best);renderGacha()};
  if(reduce){finish();return}
  const t0=performance.now();
  const step=now=>{const t=(now-t0)/1000;
    if(t<.9)drawMachine({rot:t/.9*Math.PI*2,jit:2.2});
    else if(t<1.55){const k=Math.min(1,(t-.9)/.35);const b=t>1.25?Math.sin(Math.min(1,(t-1.25)/.3)*Math.PI)*5:0;drawMachine({cap:{y:186+28*k-b,col:RCOL[best],glow:best>=3}})}
    else return finish();
    requestAnimationFrame(step)};
  requestAnimationFrame(step);
}
function showResults(out,best){
  const box=$("gres");box.innerHTML="";
  out.forEach(({it,isNew},i)=>{
    const b=document.createElement("button");b.className="card r"+it.r;b.style.setProperty("--rc",RCOL[it.r]);b.style.animationDelay=(i*90)+"ms";
    const cv=document.createElement("canvas");cv.width=cv.height=128;thumb(cv.getContext("2d"),variant(it.cat,it.val,P.look),it.cat);b.appendChild(cv);
    b.insertAdjacentHTML("beforeend",`<span class="rn" style="color:${RCOL[it.r]}">${RNAME[it.r]} ${starStr(it.r)}</span><span class="nm">${it.n}</span><span class="bd${isNew?" new":""}">${isNew?"NEW":"かぶり +"+DUPE[it.r]+"石"}</span>`);
    b.onclick=()=>equip(it);b.setAttribute("aria-label",`${it.n}を装備する`);box.appendChild(b)});
  const nNew=out.filter(o=>o.isNew).length,dup=out.length-nNew,ref=out.filter(o=>!o.isNew).reduce((s,o)=>s+DUPE[o.it.r],0);
  $("gmsg").textContent=`${best===4?"SSRが出た！ ":best===3?"SRが出た！ ":""}NEW ×${nNew}${dup?`　かぶり ×${dup}（石+${ref}）`:""}\nカードをタップすると、その場で着がえられます。`;
  if(best===4){const w=$("gachaWin");w.classList.remove("ssr");void w.offsetWidth;w.classList.add("ssr")}
}
function equip(it){P.look=variant(it.cat,it.val,P.look);save();stats();drawGachaHero();$("gmsg").textContent=`${it.n}を装備した！ 衣装画面でいつでも着がえられます。`}
$("g1").onclick=()=>pull(1);$("g10").onclick=()=>pull(10);

/* ================= stone shop (demo: no real payment) ================= */
const yen=v=>"¥"+v.toLocaleString("ja-JP");
function renderShop(){
  $("packs").innerHTML="";
  SHOP.forEach((p,i)=>{const b=document.createElement("button");b.className="pack";
    b.innerHTML=`<canvas width="96" height="96" aria-hidden="true"></canvas><span class="pn">${p.n}</span><span class="pst">石 ${(p.st+p.bonus).toLocaleString()}</span>${p.bonus?`<span class="pb">おまけ +${p.bonus}</span>`:`<span class="pb none">　</span>`}<span class="py">${yen(p.yen)}</span>`;
    drawGem(b.querySelector("canvas").getContext("2d"),i);b.onclick=()=>askBuy(p);$("packs").appendChild(b)});
  $("spent").textContent=`これまでのお試し課金：${yen(P.spent||0)}（実際の請求はありません）`;
}
function drawGem(c,lvl){c.clearRect(0,0,96,96);const n=Math.min(lvl+1,5);
  const spots=[[48,56],[30,62],[66,62],[40,40],[58,40]];
  for(let k=n-1;k>=0;k--){const[x,y]=spots[k];c.save();c.translate(x,y);
    const g=c.createLinearGradient(-12,-14,12,14);g.addColorStop(0,"#e6f7ff");g.addColorStop(.5,"#7fd1e8");g.addColorStop(1,"#3a6fd1");
    c.fillStyle=g;c.strokeStyle="#1d2f5e";c.lineWidth=2;c.beginPath();c.moveTo(0,-15);c.lineTo(12,-4);c.lineTo(0,15);c.lineTo(-12,-4);c.closePath();c.fill();c.stroke();
    c.strokeStyle="rgba(255,255,255,.7)";c.lineWidth=1.2;c.beginPath();c.moveTo(-12,-4);c.lineTo(12,-4);c.moveTo(0,-15);c.lineTo(-4,-4);c.lineTo(0,15);c.stroke();c.restore()}
  if(lvl>=3){c.fillStyle="#f6d24a";star(c,78,20,7,"#f6d24a");star(c,18,24,4,"#fff3b0")}}
function askBuy(p){
  const box=$("confirm");box.hidden=false;
  box.innerHTML=`<p><b>${p.n}</b>（石 ${(p.st+p.bonus).toLocaleString()}）を ${yen(p.yen)} で購入しますか？<br><small>お試し版のため、実際のお金はかかりません。</small></p><div class="cbtns"><button id="cno">やめる</button><button id="cyes" class="yes">購入する</button></div>`;
  $("cno").onclick=()=>{box.hidden=true};
  $("cyes").onclick=()=>{P.stones+=p.st+p.bonus;P.spent=(P.spent||0)+p.yen;save();box.hidden=true;renderShop();renderGacha();stats();
    $("gmsg").textContent=`きらめき石を ${(p.st+p.bonus).toLocaleString()}個 手に入れた！`};
  $("cyes").focus();
}
$("gshop").onclick=()=>{const s=$("shop");s.hidden=!s.hidden;if(!s.hidden){renderShop();$("confirm").hidden=true;s.scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"})}};
$("shopclose").onclick=()=>{$("shop").hidden=true};

/* ================= boot ================= */
drawStatic();
if(P&&P.look){rx=P.x;ry=P.y;show("home");log(`冒険の記録から再開した。おかえり、${P.look.name}。`)}
else openCreator(true);
requestAnimationFrame(frame);
if(document.fonts)document.fonts.ready.then(()=>{if(view==="gacha"&&!gBusy)drawMachine()});
</script>
